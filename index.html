<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreador de Hábitos</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #8b8f9a;
    --accent: #6ee7b7;
    --accent-dim: #234a3c;
    --danger: #f87171;
    --shadow: rgba(0,0,0,0.4);
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #eceff3;
    --border: #dde1e7;
    --text: #16181d;
    --text-dim: #6b7280;
    --accent: #10a37f;
    --accent-dim: #d3f2e8;
    --danger: #dc2626;
    --shadow: rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 80px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.12) rotate(-4deg); }
  }
  .wrap > * {
    animation: fadeInUp 0.5s ease both;
  }
  .wrap > header { animation-delay: 0s; }
  .wrap > .add-row { animation-delay: 0.08s; }
  .wrap > .data-row { animation-delay: 0.14s; }
  .wrap > #habitList { animation-delay: 0.2s; }
  .wrap > #emptyState { animation-delay: 0.2s; }
  .wrap > footer { animation-delay: 0.28s; }
  .flame {
    display: inline-block;
    animation: flicker 2.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .wrap > *, .flame { animation: none; }
  }
  header {
    margin-bottom: 28px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--text-dim); font-size: 0.9rem; }
  .theme-toggle {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 1.1rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--accent); }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .add-row input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row select {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 10px;
    color: var(--text);
    font-size: 0.9rem;
  }
  .add-row button, .icon-btn {
    background: var(--accent);
    color: #0b1210;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .add-row button:hover { filter: brightness(1.08); }

  .data-row {
    display: flex;
    gap: 16px;
    margin: -12px 0 24px;
  }
  .text-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }
  .text-btn:hover { color: var(--accent); }

  .habit-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .habit-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .habit-name {
    font-weight: 600;
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .category-badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .habit-meta {
    color: var(--text-dim);
    font-size: 0.82rem;
    margin-top: 2px;
  }
  .streak-badge {
    background: var(--accent-dim);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .habit-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .check-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .check-btn.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b1210;
  }
  .check-btn:hover { border-color: var(--accent); }
  .del-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    padding: 6px;
    border-radius: 8px;
  }
  .del-btn:hover { color: var(--danger); background: rgba(248,113,113,0.1); }

  .heatmap {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(11px, 1fr));
    gap: 3px;
    margin-top: 4px;
  }
  .cell {
    aspect-ratio: 1;
    border-radius: 3px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .cell.lvl1 { background: var(--accent-dim); border-color: var(--accent-dim); }
  .cell.lvl2 { background: var(--accent); border-color: var(--accent); opacity: 0.85; }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 0.95rem;
  }
  .empty span { font-size: 2rem; display: block; margin-bottom: 10px; }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 30px;
  }

  .lock-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lock-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    text-align: center;
    width: 260px;
  }
  .lock-icon { font-size: 2rem; margin-bottom: 8px; }
  .lock-title { font-weight: 600; margin-bottom: 16px; }
  #lockInput {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 1rem;
    text-align: center;
    margin-bottom: 12px;
    outline: none;
  }
  #lockInput:focus { border-color: var(--accent); }
  #unlockBtn {
    width: 100%;
    background: var(--accent);
    color: #0b1210;
    border: none;
    border-radius: 10px;
    padding: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .lock-error { color: var(--danger); font-size: 0.82rem; margin-top: 10px; }
  #biometricUnlockBtn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  #biometricUnlockBtn:hover { border-color: var(--accent); }
  .sponsor-link {
    display: inline-block;
    margin-top: 10px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .sponsor-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div id="lockScreen" class="lock-screen" style="display:none;">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">Ingresá tu PIN</div>
      <input id="lockInput" type="password" inputmode="numeric" maxlength="12" placeholder="PIN" />
      <button id="unlockBtn">Desbloquear</button>
      <button id="biometricUnlockBtn" style="display:none;">👆 Usar Face ID / Huella</button>
      <div id="lockError" class="lock-error" style="display:none;">PIN incorrecto</div>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div>
        <h1><span class="flame">🔥</span> Rastreador de Hábitos</h1>
        <div class="sub">Marca tus hábitos cada día y mira crecer tu racha.</div>
      </div>
      <button id="themeToggle" class="theme-toggle" title="Cambiar tema">🌙</button>
    </header>

    <div class="add-row">
      <input id="habitInput" type="text" placeholder="Nuevo hábito, ej: Leer 10 páginas" maxlength="60" />
      <select id="categorySelect" title="Categoría"></select>
      <button id="addBtn">Añadir</button>
    </div>

    <div class="data-row">
      <button id="exportBtn" class="text-btn">Exportar datos</button>
      <button id="importBtn" class="text-btn">Importar datos</button>
      <button id="pinBtn" class="text-btn">🔒 PIN</button>
      <button id="biometricBtn" class="text-btn">👆 Face ID/Huella</button>
      <input id="importFile" type="file" accept="application/json" style="display:none;" />
    </div>

    <div id="habitList"></div>
    <div id="emptyState" class="empty" style="display:none;">
      <span>🌱</span>
      Aún no tienes hábitos. Añade el primero arriba.
    </div>

    <footer>
      Tus datos se guardan solo en este navegador (localStorage).<br>
      <a href="https://github.com/sponsors/infohumbrellauy-dev" target="_blank" rel="noopener" class="sponsor-link">☕ Apoyar este proyecto</a>
    </footer>
  </div>

<script>
(function () {
  const STORAGE_KEY = "habit-tracker-data-v1";
  const THEME_KEY = "habit-tracker-theme-v1";
  const PIN_KEY = "habit-tracker-pin-v1";
  const WEBAUTHN_ID_KEY = "habit-tracker-webauthn-id-v1";
  const DAYS_HISTORY = 91; // ~13 weeks heatmap

  const CATEGORIES = [
    { id: "general", label: "General", color: "#8b8f9a" },
    { id: "fitness", label: "💪 Fitness", color: "#f59e0b" },
    { id: "salud", label: "🩺 Salud", color: "#60a5fa" },
    { id: "estudio", label: "📚 Estudio", color: "#a78bfa" },
    { id: "otro", label: "✨ Otro", color: "#f472b6" }
  ];

  function getCategory(id) {
    return CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
  }

  // Ofuscación simple, NO es cifrado real: solo evita mostrar el PIN en texto plano.
  function simpleHash(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    }
    return hash.toString(36);
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("themeToggle").textContent = theme === "light" ? "☀️" : "🌙";
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }

  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    const theme = saved || "dark";
    applyTheme(theme);
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function loadHabits() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveHabits(habits) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    } catch (e) {}
  }

  let habits = loadHabits();

  function addHabit(name, category) {
    name = name.trim();
    if (!name) return;
    habits.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name: name,
      category: category || "general",
      createdAt: todayStr(),
      dates: []
    });
    saveHabits(habits);
    render();
  }

  function deleteHabit(id) {
    habits = habits.filter(h => h.id !== id);
    saveHabits(habits);
    render();
  }

  function editHabitName(id) {
    const h = habits.find(x => x.id === id);
    if (!h) return;
    const newName = prompt("Nuevo nombre del hábito:", h.name);
    if (newName === null) return;
    const trimmed = newName.trim();
    if (!trimmed) return;
    h.name = trimmed;
    saveHabits(habits);
    render();
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(habits, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "habit-tracker-backup-" + todayStr() + ".json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error("Formato inválido");
        habits = parsed;
        saveHabits(habits);
        render();
      } catch (e) {
        alert("No se pudo importar el archivo: formato inválido.");
      }
    };
    reader.readAsText(file);
  }

  function isLocked() {
    try { return !!localStorage.getItem(PIN_KEY); } catch (e) { return false; }
  }

  function hasBiometric() {
    try { return !!localStorage.getItem(WEBAUTHN_ID_KEY); } catch (e) { return false; }
  }

  function isWebAuthnAvailable() {
    return typeof window.PublicKeyCredential !== "undefined" && !!navigator.credentials;
  }

  function bufToB64(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }

  function b64ToBuf(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  async function registerBiometric() {
    if (!isWebAuthnAvailable()) {
      alert("Tu navegador no soporta Face ID / huella (WebAuthn) en este contexto.");
      return;
    }
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const userId = crypto.getRandomValues(new Uint8Array(16));
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge,
          rp: { name: "Rastreador de Hábitos" },
          user: { id: userId, name: "usuario-local", displayName: "Usuario local" },
          pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
          authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
          timeout: 60000
        }
      });
      localStorage.setItem(WEBAUTHN_ID_KEY, bufToB64(cred.rawId));
      alert("Face ID / huella configurado en este dispositivo.");
    } catch (e) {
      alert("No se pudo configurar Face ID/huella acá: " + e.message + "\n\nEsto suele pasar al abrir el archivo directamente (file://). Funciona de forma confiable si la app está publicada en un servidor con HTTPS (por ejemplo GitHub Pages).");
    }
  }

  async function removeBiometric() {
    localStorage.removeItem(WEBAUTHN_ID_KEY);
    alert("Face ID / huella desactivado.");
  }

  function manageBiometric() {
    if (hasBiometric()) {
      if (confirm("Ya tenés Face ID/huella configurado en este dispositivo. ¿Querés quitarlo?")) {
        removeBiometric();
      }
    } else {
      registerBiometric();
    }
  }

  async function authenticateBiometric(onSuccess) {
    if (!isWebAuthnAvailable()) {
      alert("Tu navegador no soporta Face ID / huella acá.");
      return;
    }
    try {
      const idBuf = b64ToBuf(localStorage.getItem(WEBAUTHN_ID_KEY));
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      await navigator.credentials.get({
        publicKey: {
          challenge,
          allowCredentials: [{ id: idBuf, type: "public-key" }],
          userVerification: "required",
          timeout: 60000
        }
      });
      onSuccess();
    } catch (e) {
      alert("No se pudo verificar con Face ID/huella (" + e.message + "). Usá tu PIN.");
    }
  }

  function showLockScreen(onUnlock) {
    const screen = document.getElementById("lockScreen");
    const input = document.getElementById("lockInput");
    const error = document.getElementById("lockError");
    const bioBtn = document.getElementById("biometricUnlockBtn");
    screen.style.display = "flex";
    input.value = "";
    error.style.display = "none";
    input.focus();

    function finishUnlock() {
      screen.style.display = "none";
      onUnlock();
    }

    function tryUnlock() {
      const stored = localStorage.getItem(PIN_KEY);
      if (simpleHash(input.value) === stored) {
        finishUnlock();
      } else {
        error.style.display = "block";
        input.value = "";
        input.focus();
      }
    }

    document.getElementById("unlockBtn").onclick = tryUnlock;
    input.onkeydown = (e) => { if (e.key === "Enter") tryUnlock(); };

    if (hasBiometric() && isWebAuthnAvailable()) {
      bioBtn.style.display = "block";
      bioBtn.onclick = () => authenticateBiometric(finishUnlock);
    } else {
      bioBtn.style.display = "none";
    }
  }

  function managePin() {
    const current = localStorage.getItem(PIN_KEY);
    if (!current) {
      const p1 = prompt("Crear un PIN para proteger el acceso local a esta app (esto NO es cifrado, solo evita que alguien con acceso a tu dispositivo abra la app sin querer):");
      if (!p1) return;
      localStorage.setItem(PIN_KEY, simpleHash(p1));
      alert("PIN configurado.");
    } else {
      const p = prompt("Ingresá tu PIN actual:");
      if (p === null) return;
      if (simpleHash(p) !== current) { alert("PIN incorrecto."); return; }
      const remove = confirm("PIN correcto. Aceptar = quitar la protección. Cancelar = cambiarlo por uno nuevo.");
      if (remove) {
        localStorage.removeItem(PIN_KEY);
        alert("Protección quitada.");
      } else {
        const newPin = prompt("Nuevo PIN:");
        if (newPin) {
          localStorage.setItem(PIN_KEY, simpleHash(newPin));
          alert("PIN actualizado.");
        }
      }
    }
  }

  function toggleToday(id) {
    const h = habits.find(x => x.id === id);
    if (!h) return;
    const t = todayStr();
    const idx = h.dates.indexOf(t);
    if (idx >= 0) h.dates.splice(idx, 1);
    else h.dates.push(t);
    saveHabits(habits);
    render();
  }

  function computeStreak(dates) {
    const set = new Set(dates);
    let streak = 0;
    let d = new Date();
    // if today not done yet, start counting from yesterday (streak still "alive")
    if (!set.has(todayStr())) {
      d.setDate(d.getDate() - 1);
    }
    while (true) {
      const s = d.toISOString().slice(0, 10);
      if (set.has(s)) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function buildHeatmap(dates) {
    const set = new Set(dates);
    const cells = [];
    const today = new Date();
    for (let i = DAYS_HISTORY - 1; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const s = d.toISOString().slice(0, 10);
      cells.push({ date: s, done: set.has(s) });
    }
    return cells;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const list = document.getElementById("habitList");
    const empty = document.getElementById("emptyState");

    if (habits.length === 0) {
      list.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    list.innerHTML = habits.map(h => {
      const streak = computeStreak(h.dates);
      const doneToday = h.dates.includes(todayStr());
      const cells = buildHeatmap(h.dates);
      const cellsHtml = cells.map(c => {
        let cls = "cell";
        if (c.done) cls += " lvl2";
        return `<div class="${cls}" title="${c.date}"></div>`;
      }).join("");

      const cat = getCategory(h.category);
      return `
        <div class="habit-card">
          <div class="habit-top">
            <div>
              <div class="habit-name">
                ${escapeHtml(h.name)}
                <span class="category-badge" style="background:${cat.color}33; color:${cat.color};">${cat.label}</span>
              </div>
              <div class="habit-meta">${h.dates.length} días completados en total</div>
            </div>
            <div class="habit-actions">
              <span class="streak-badge">🔥 ${streak} día${streak === 1 ? "" : "s"}</span>
              <button class="check-btn ${doneToday ? "done" : ""}" data-id="${h.id}" title="Marcar hoy">
                ${doneToday ? "✓" : ""}
              </button>
              <button class="del-btn" data-edit="${h.id}" title="Editar nombre">✎</button>
              <button class="del-btn" data-del="${h.id}" title="Eliminar">✕</button>
            </div>
          </div>
          <div class="heatmap">${cellsHtml}</div>
        </div>
      `;
    }).join("");

    list.querySelectorAll(".check-btn").forEach(btn => {
      btn.addEventListener("click", () => toggleToday(btn.dataset.id));
    });
    list.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (confirm("¿Eliminar este hábito y su historial?")) {
          deleteHabit(btn.dataset.del);
        }
      });
    });
    list.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => editHabitName(btn.dataset.edit));
    });
  }

  const categorySelect = document.getElementById("categorySelect");
  categorySelect.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join("");

  document.getElementById("addBtn").addEventListener("click", () => {
    const input = document.getElementById("habitInput");
    addHabit(input.value, categorySelect.value);
    input.value = "";
    input.focus();
  });

  document.getElementById("habitInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      document.getElementById("addBtn").click();
    }
  });

  document.getElementById("exportBtn").addEventListener("click", exportData);

  document.getElementById("importBtn").addEventListener("click", () => {
    document.getElementById("importFile").click();
  });

  document.getElementById("importFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) importData(file);
    e.target.value = "";
  });

  document.getElementById("themeToggle").addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    applyTheme(current === "light" ? "dark" : "light");
  });

  document.getElementById("pinBtn").addEventListener("click", managePin);
  document.getElementById("biometricBtn").addEventListener("click", manageBiometric);

  initTheme();
  if (isLocked()) {
    showLockScreen(render);
  } else {
    render();
  }
})();
</script>
</body>
</html>
