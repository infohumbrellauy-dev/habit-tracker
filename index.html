<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreador de Hábitos</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #8b8f9a;
    --accent: #6ee7b7;
    --accent-dim: #234a3c;
    --danger: #f87171;
    --shadow: rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--text-dim); font-size: 0.9rem; }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .add-row input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button, .icon-btn {
    background: var(--accent);
    color: #0b1210;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .add-row button:hover { filter: brightness(1.08); }

  .habit-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .habit-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .habit-name {
    font-weight: 600;
    font-size: 1.05rem;
  }
  .habit-meta {
    color: var(--text-dim);
    font-size: 0.82rem;
    margin-top: 2px;
  }
  .streak-badge {
    background: var(--accent-dim);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .habit-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .check-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .check-btn.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b1210;
  }
  .check-btn:hover { border-color: var(--accent); }
  .del-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    padding: 6px;
    border-radius: 8px;
  }
  .del-btn:hover { color: var(--danger); background: rgba(248,113,113,0.1); }

  .heatmap {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(11px, 1fr));
    gap: 3px;
    margin-top: 4px;
  }
  .cell {
    aspect-ratio: 1;
    border-radius: 3px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .cell.lvl1 { background: var(--accent-dim); border-color: var(--accent-dim); }
  .cell.lvl2 { background: var(--accent); border-color: var(--accent); opacity: 0.85; }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 0.95rem;
  }
  .empty span { font-size: 2rem; display: block; margin-bottom: 10px; }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 30px;
  }
  .sponsor-link {
    display: inline-block;
    margin-top: 10px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .sponsor-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🔥 Rastreador de Hábitos</h1>
      <div class="sub">Marca tus hábitos cada día y mira crecer tu racha.</div>
    </header>

    <div class="add-row">
      <input id="habitInput" type="text" placeholder="Nuevo hábito, ej: Leer 10 páginas" maxlength="60" />
      <button id="addBtn">Añadir</button>
    </div>

    <div id="habitList"></div>
    <div id="emptyState" class="empty" style="display:none;">
      <span>🌱</span>
      Aún no tienes hábitos. Añade el primero arriba.
    </div>

    <footer>
      Tus datos se guardan solo en este navegador (localStorage).<br>
      <a href="https://github.com/sponsors/infohumbrellauy-dev" target="_blank" rel="noopener" class="sponsor-link">☕ Apoyar este proyecto</a>
    </footer>
  </div>

<script>
(function () {
  const STORAGE_KEY = "habit-tracker-data-v1";
  const DAYS_HISTORY = 91; // ~13 weeks heatmap

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function loadHabits() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveHabits(habits) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    } catch (e) {}
  }

  let habits = loadHabits();

  function addHabit(name) {
    name = name.trim();
    if (!name) return;
    habits.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name: name,
      createdAt: todayStr(),
      dates: []
    });
    saveHabits(habits);
    render();
  }

  function deleteHabit(id) {
    habits = habits.filter(h => h.id !== id);
    saveHabits(habits);
    render();
  }

  function toggleToday(id) {
    const h = habits.find(x => x.id === id);
    if (!h) return;
    const t = todayStr();
    const idx = h.dates.indexOf(t);
    if (idx >= 0) h.dates.splice(idx, 1);
    else h.dates.push(t);
    saveHabits(habits);
    render();
  }

  function computeStreak(dates) {
    const set = new Set(dates);
    let streak = 0;
    let d = new Date();
    // if today not done yet, start counting from yesterday (streak still "alive")
    if (!set.has(todayStr())) {
      d.setDate(d.getDate() - 1);
    }
    while (true) {
      const s = d.toISOString().slice(0, 10);
      if (set.has(s)) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function buildHeatmap(dates) {
    const set = new Set(dates);
    const cells = [];
    const today = new Date();
    for (let i = DAYS_HISTORY - 1; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const s = d.toISOString().slice(0, 10);
      cells.push({ date: s, done: set.has(s) });
    }
    return cells;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const list = document.getElementById("habitList");
    const empty = document.getElementById("emptyState");

    if (habits.length === 0) {
      list.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    list.innerHTML = habits.map(h => {
      const streak = computeStreak(h.dates);
      const doneToday = h.dates.includes(todayStr());
      const cells = buildHeatmap(h.dates);
      const cellsHtml = cells.map(c => {
        let cls = "cell";
        if (c.done) cls += " lvl2";
        return `<div class="${cls}" title="${c.date}"></div>`;
      }).join("");

      return `
        <div class="habit-card">
          <div class="habit-top">
            <div>
              <div class="habit-name">${escapeHtml(h.name)}</div>
              <div class="habit-meta">${h.dates.length} días completados en total</div>
            </div>
            <div class="habit-actions">
              <span class="streak-badge">🔥 ${streak} día${streak === 1 ? "" : "s"}</span>
              <button class="check-btn ${doneToday ? "done" : ""}" data-id="${h.id}" title="Marcar hoy">
                ${doneToday ? "✓" : ""}
              </button>
              <button class="del-btn" data-del="${h.id}" title="Eliminar">✕</button>
            </div>
          </div>
          <div class="heatmap">${cellsHtml}</div>
        </div>
      `;
    }).join("");

    list.querySelectorAll(".check-btn").forEach(btn => {
      btn.addEventListener("click", () => toggleToday(btn.dataset.id));
    });
    list.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (confirm("¿Eliminar este hábito y su historial?")) {
          deleteHabit(btn.dataset.del);
        }
      });
    });
  }

  document.getElementById("addBtn").addEventListener("click", () => {
    const input = document.getElementById("habitInput");
    addHabit(input.value);
    input.value = "";
    input.focus();
  });

  document.getElementById("habitInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      document.getElementById("addBtn").click();
    }
  });

  render();
})();
</script>
</body>
</html>
